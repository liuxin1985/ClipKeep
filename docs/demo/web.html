<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ClipKeep 划词工具条目测页（本地目测用，不入库）</title>
<link rel="stylesheet" href="content.css">
<style>
  body { max-width: 720px; margin: 40px auto; font: 15px/1.8 -apple-system, "PingFang SC", sans-serif; padding: 0 20px; }
  #log { display: none; margin-top: 32px; padding: 12px; background: #f6f7f9; border-radius: 8px; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>量子计算入门</h2>
<p id="p1">量子比特可以同时处于两种状态的叠加态，这意味着 n 个量子比特能够同时表示 2 的 n 次方个状态。在算法层面，量子并行让我们有机会一次评估指数级多的输入分支，再通过干涉把错误答案相消、把正确答案放大。</p>
<p id="p2">Grover 搜索给出平方级加速，Shor 分解则在多项式时间内完成大整数分解，这也是后量子密码要提前换轨的原因。</p>
<p id="p3">退相干时间决定了能做多少层门，纠错码用多个<strong>物理比特</strong>拼一个<em>逻辑比特</em>，代价是门保真度必须高于阈值。</p>
<div id="log">—</div>

<script>
/* 浏览器里跑 content.js 用的最小 chrome 桩 */
(() => {
  // 界面语言钉成中文：无头 Chrome 的界面语言是 en-US，偏好留空 = auto = 英文，
  // 划词浮层那几帧会悄悄换成英文。?lang=en 留给「英文界面」那一帧单独抓。
  const UI_LANG = (() => {
    try {
      const p = new URLSearchParams(location.search).get("lang");
      return ["auto", "zh", "en"].indexOf(p) >= 0 ? p : "zh";
    } catch (_) { return "zh"; }
  })();
  const store = { clipkeep_items: [], clipkeep_highlights: [], clipkeep_trash: [], clipkeep_activity: {}, clipkeep_prefs: { lang: UI_LANG } };
  // ?seed=<encodeURIComponent(JSON)> 可以预置高亮：桩里的存储活不过一次加载，
  // 想把上一次划选出来的记录带到「刷新后」那一次启动来看重放，只能从 URL 带。
  // url 一律改成本页地址：content.js 按整页 URL（含 query）挑高亮，照抄种子自带的地址就永远匹配不上。
  try {
    const seed = new URLSearchParams(location.search).get("seed");
    if (seed) store.clipkeep_highlights = JSON.parse(decodeURIComponent(seed))
      .map((h) => ({ ...h, url: location.href }));
  } catch (_) { /* 种子坏了就当没带，别拖垮整张截图页 */ }
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const listeners = [];
  const storageListeners = [];
  const dump = () => { document.getElementById("log").textContent = JSON.stringify(store.clipkeep_highlights, null, 1); };
  window.__ckStore = store;
  window.__ckDump = dump;
  /** 真 API 里 set 之后一定会广播 onChanged，桩必须照做：content.js 的高亮重放就挂在这个事件上，
      不广播的话截图页只能看到首次加载的那次重放，重叠高亮之类的同步路径根本拍不到。 */
  const fireChanged = (obj) => {
    const changes = {};
    Object.keys(obj).forEach((k) => { changes[k] = { newValue: clone(store[k]) }; });
    storageListeners.forEach((fn) => { try { fn(changes, "local"); } catch (_) {} });
  };
  chrome = {
    storage: {
      local: {
        async get(keys) {
          const list = Array.isArray(keys) ? keys : [keys];
          const out = {};
          list.forEach((k) => { if (k in store) out[k] = clone(store[k]); });
          dump();
          return out;
        },
        async set(obj) { Object.assign(store, clone(obj)); fireChanged(obj); dump(); },
      },
      onChanged: { addListener(fn) { storageListeners.push(fn); } },
    },
    runtime: {
      sendMessage(msg, cb) {
        const done = (res) => { dump(); if (typeof cb === "function") cb(res); return res; };
        if (typeof msg === "function" || !msg || !msg.type) return Promise.resolve(done({ ok: true }));
        if (msg.type === "clipkeep:hl-add") { store.clipkeep_highlights.push(msg.payload); return done({ ok: true, id: msg.payload.id }); }
        if (msg.type === "clipkeep:hl-update") {
          const h = store.clipkeep_highlights.find((x) => x.id === msg.id);
          if (h) Object.assign(h, msg.patch);
          return done({ ok: true });
        }
        if (msg.type === "clipkeep:hl-reanchor") {
          // 和真后台一条口径：只换正文 / 锚点 / 标题，id、批注、颜色、落点时间一个都不动
          const h = store.clipkeep_highlights.find((x) => x.id === msg.id);
          if (!h) return done({ ok: false, error: "not_found" });
          const p = msg.payload || {};
          const next = { ...h, text: String(p.text || h.text) };
          if (p.title !== undefined) next.title = String(p.title);
          if (p.segs) next.segs = p.segs;
          else delete next.segs; // 旧锚点配新正文比没锚点更糟：照抄后台那条规矩
          store.clipkeep_highlights = store.clipkeep_highlights.map((x) => (x === h ? next : x));
          fireChanged({ clipkeep_highlights: 1 }); // 广播一次，content.js 才会按新锚点重放
          return done({ ok: true, id: h.id });
        }
        if (msg.type === "clipkeep:add") {
          if (msg.payload) store.clipkeep_items.push(msg.payload); // 桩也要真的落库，截图才不是空列表
          return done({ ok: true, items: store.clipkeep_items });
        }
        return done({ ok: true, items: store.clipkeep_items });
      },
      onMessage: { addListener(fn) { listeners.push(fn); } },
      getURL: (p) => p,
    },
    tabs: { async query() { return [{ id: 1 }]; }, async sendMessage() { return { ok: true }; } },
  };
  /* 弹窗 → 本页那两类消息（自检、修复交接）在真扩展里走 tabs.sendMessage。
     截图页没有第二个上下文，直接把消息递给页面脚本自己注册的监听器，
     走的仍是 content.js 里那个 msg.type 分支，横幅不是手工拼出来的假 DOM。 */
  window.__ckAskPage = (msg) => new Promise((resolve) => {
    const fn = listeners[listeners.length - 1];
    if (!fn) { resolve(undefined); return; }
    fn(msg, { tab: { id: 1 } }, resolve);
  });
})();
</script>
<script src="content.js"></script>
<script>
/* 模拟「划选一段文字」：真浏览器里用鼠标拖，这里用脚本选区，工具条一样会弹出 */
window.__ckSelect = (id, from, to) => {
  const node = document.getElementById(id).firstChild;
  const r = document.createRange();
  r.setStart(node, from);
  r.setEnd(node, to);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
  document.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
  return node.data.slice(from, to);
};
</script>
</body>
</html>
